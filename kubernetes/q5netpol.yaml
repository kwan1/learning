apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web-backend
  name: web-backend
  namespace: web-zone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-backend
  strategy: {}
  template:
    metadata:
      labels:
        app: web-backend
    spec:
      containers:
      - image: nginx
        name: nginx
        resources: {}
status: {}
