apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: secure-app
  name: secure-app
  namespace: secure-zone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-app
  strategy: {}
  template:
    metadata:
      labels:
        app: secure-app
    spec:
      containers:
      - image: nginx
        name: nginx
        resources: {}
status: {}
